<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-label="TerPlot — natural language to seaborn plots, in your terminal">
  <title>TerPlot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="684" y="48" width="460" height="224" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#30363d"/>

  <g>
    <circle cx="60" cy="42" r="6" fill="#ff5f57"/>
    <circle cx="82" cy="42" r="6" fill="#febc2e"/>
    <circle cx="104" cy="42" r="6" fill="#28c840"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="144" font-size="68" font-weight="700" letter-spacing="1" fill="url(#mark)">TerPlot</text>
    <text x="58" y="182" font-size="21" fill="#8b949e">natural language &#8594; seaborn</text>

    <rect x="56" y="212" width="552" height="60" rx="10" fill="#010409" stroke="#21262d"/>
    <text x="80" y="249" font-size="20">
      <tspan fill="#22d3ee">&gt;</tspan><tspan fill="#c9d1d9"> revenue by region, descending</tspan>
    </text>
  </g>

  <g stroke="#484f58" stroke-width="2" fill="none">
    <path d="M624 242 h28"/>
    <path d="M646 235 l8 7 -8 7" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <g clip-path="url(#card)">
    <rect x="684" y="48" width="460" height="224" fill="#eaeaf2"/>
    <g stroke="#ffffff" stroke-width="2">
      <path d="M704 96 H1124"/>
      <path d="M704 136 H1124"/>
      <path d="M704 176 H1124"/>
      <path d="M704 216 H1124"/>
    </g>
    <g>
      <rect x="716" y="88" width="72" height="158" fill="#4c72b0"/>
      <rect x="820" y="124" width="72" height="122" fill="#dd8452"/>
      <rect x="924" y="158" width="72" height="88" fill="#55a868"/>
      <rect x="1028" y="192" width="72" height="54" fill="#c44e52"/>
    </g>
    <path d="M704 246 H1124" stroke="#c8c8d8" stroke-width="2"/>
    <text x="704" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#8a8aa0">plots/plot_003.png</text>
  </g>
  <rect x="684.5" y="48.5" width="459" height="223" rx="12" fill="none" stroke="#30363d"/>
</svg>
